<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lapak Kuota</title>
<style>
:root{--b:#0f766e;--bg:#f2f5f4;--c:#fff;--t:#17221f;--m:#66757a;--r:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#0f1716;--c:#1a2523;--t:#e4ecea;--m:#93a4a2}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{background:var(--b);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
nav{display:flex;overflow-x:auto;background:var(--c);border-bottom:1px solid #8883}
nav button{flex:none;border:0;background:none;padding:12px 14px;color:var(--m);font:inherit;border-radius:0}
nav .on{color:var(--b);border-bottom:2px solid var(--b);font-weight:600}
main{padding:12px;max-width:760px;margin:auto}
.card{background:var(--c);border-radius:10px;padding:12px;margin-bottom:10px}
input,select,button,textarea{font:inherit;padding:9px;border:1px solid #8886;border-radius:8px;background:var(--c);color:var(--t);max-width:100%}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--b)}
.btn{background:var(--b);color:#fff;border:0}.red{background:var(--r);color:#fff;border:0}
.row{display:flex;gap:8px;align-items:center;margin:6px 0}.row>*{flex:1}.sp{justify-content:space-between}
.w{width:100%;margin:4px 0}.m{color:var(--m);font-size:13px}.low{color:var(--r);font-weight:600}
ul{padding:0;margin:0}li{list-style:none}.it{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #8883;cursor:pointer}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:12px;z-index:9}
.modal>div{background:var(--c);border-radius:12px;padding:14px;max-height:92vh;overflow:auto;width:100%;max-width:400px}
#rc{width:58mm;font:12px monospace;color:#000;background:#fff;padding:2mm;margin:auto}
@page{size:58mm auto;margin:0}
@media print{body *{visibility:hidden}#rc,#rc *{visibility:visible}#rc{position:fixed;left:0;top:0}}
</style></head><body><div id="app"></div><div id="md"></div>
<script>
const URL_API="https://script.google.com/macros/s/AKfycbzC8Zi0mQT3nImUKjoJJM4nFD7ia3Me9dSV5-OE257ZcyyH3GdlSXjOn7KG3eL8g6iHZA/exec"; // tempel URL Web app Apps Script di sini
const $=s=>document.querySelector(s),rp=n=>"Rp"+Math.round(n).toLocaleString("id-ID"),sum=a=>a.reduce((x,y)=>x+y,0);
const E=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={g:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let S={ops:LS.g("ops",[]),pend:LS.g("pend",[]),last:LS.g("last",0),me:LS.g("me",null),dev:LS.g("dev",null),n:LS.g("n",0)};
if(!S.dev){S.dev=Math.random().toString(36).slice(2,4).toUpperCase();LS.s("dev",S.dev)}
const save=()=>{LS.s("ops",S.ops);LS.s("pend",S.pend);LS.s("last",S.last);LS.s("me",S.me);LS.s("n",S.n)};
let M,cart=[],tab="kasir",qs="",online=navigator.onLine,busy=0,setup=null,fq=0,per="hari",HL=[],LG="";
const TB=[["kasir","Kasir"],["produk","Produk"],["hutang","Hutang"],["saldo","Saldo"],["lap","Laporan"],["akun","Akun"],["set","Setelan"]];
const own=()=>S.me.role=="owner";
async function H(u,p){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("lk:"+u.toLowerCase()+":"+p));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

/* ---- data: semua keadaan dihitung dari daftar operasi ---- */
function calc(){const P={},U={},K={},D={};let cfg={name:"Lapak Kuota",header:"",footer:"Terima kasih",logo:""},saldo=0,sales=[];
 for(const o of S.ops.concat(S.pend)){const d=o.d;
  if(o.t=="prod")P[d.id]={...P[d.id],...d};
  else if(o.t=="buy"){K[d.pid]=(K[d.pid]||0)+d.qty;if(!d.i)saldo-=d.qty*d.cost}
  else if(o.t=="sale"){sales.push(d);for(const i of d.items)K[i.pid]=(K[i.pid]||0)-i.q;if(d.method=="hutang")D[d.cust]=(D[d.cust]||0)+d.total;else saldo+=d.total}
  else if(o.t=="pay"){D[d.cust]=(D[d.cust]||0)-d.amount;saldo+=d.amount}
  else if(o.t=="cash")saldo+=d.amount;
  else if(o.t=="user")U[d.u]={...U[d.u],...d};
  else if(o.t=="set")cfg={...cfg,...d}}
 return{P,U,K,D,cfg,saldo,sales}}
function op(t,d){S.pend.push({id:S.dev+Date.now().toString(36)+Math.random().toString(36).slice(2,5),t,d,ts:Date.now(),by:S.me?.u});save();render();sync()}
async function api(b){const r=await fetch(URL_API,{method:"POST",body:JSON.stringify({...b,token:S.me?.token}),headers:{"Content-Type":"text/plain;charset=utf-8"}});return r.json()}
const ind=()=>{const e=$("#ind"),n=S.pend.length;if(e)e.textContent=online?(n?"Menunggu "+n:"Tersinkron"):"Offline"+(n?" · "+n+" menunggu":"")};
async function sync(){if(busy||!S.me)return;busy=1;try{const n=S.pend.length,sent=new Set(S.pend.slice(0,n).map(o=>o.id));
 const r=await api({action:"sync",since:S.last,ops:S.pend.slice(0,n)});
 if(!r.ok){if(r.err=="auth")logout(true);throw 0}
 S.pend=S.pend.slice(n);const have=new Set(S.ops.map(o=>o.id));for(const o of r.ops)if(!have.has(o.id))S.ops.push(o);
 S.last=r.last;save();online=true;busy=0;ind();
 if(r.ops.some(o=>!sent.has(o.id))&&!document.activeElement?.matches("input,textarea"))render();return}catch(e){online=false}busy=0;ind()}
setInterval(sync,45000);addEventListener("online",sync);

/* ---- login ---- */
function authView(){if(URL_API.startsWith("PASTE"))return"<main><div class=card>Isi URL_API di bagian atas index.html dengan URL Web app Apps Script.</div></main>";
 if(setup===null)return"<main><div class=card>Menghubungkan ke server… pastikan internet aktif.<br><br><button onclick=location.reload()>Coba lagi</button></div></main>";
 return`<main><div class=card><h2>Lapak Kuota</h2><p class=m>${setup?"Buat akun Pemilik pertama":"Masuk"}</p>${setup?'<input id=an class=w placeholder="Nama">':""}<input id=au class=w placeholder=Username autocapitalize=off><input id=ap class=w type=password placeholder=Password><button class="btn w" onclick=doAuth()>${setup?"Buat akun":"Masuk"}</button></div></main>`}
async function doAuth(){const u=$("#au").value.trim().toLowerCase(),p=$("#ap").value;if(!u||!p)return;
 if(!/^[a-z0-9._-]+$/.test(u))return alert("Username: huruf kecil, angka, titik, strip");const h=await H(u,p);
 try{const r=await api(setup?{action:"setup",u,name:$("#an").value.trim()||u,h}:{action:"login",u,h});
  if(!r.ok)return alert(r.err=="lock"?"Terlalu banyak percobaan. Coba lagi 5 menit.":"Username atau password salah");
  S.me=r.me;save();online=true;sync()}catch(e){return alert("Tidak bisa terhubung ke server")}render()}
function logout(f){if(!f&&S.pend.length&&!confirm("Ada data belum tersinkron. Tetap keluar?"))return;S.me=null;save();setup=null;boot()}
function boot(){render();if(!S.me&&!URL_API.startsWith("PASTE"))api({action:"status"}).then(r=>{setup=r.setup;render()}).catch(()=>{});else sync()}

/* ---- tampilan ---- */
function render(){M=calc();const a=$("#app");if(!S.me){a.innerHTML=authView();return}
 if(!own()&&!["kasir","produk","hutang"].includes(tab))tab="kasir";
 a.innerHTML=`<header><b>Lapak Kuota</b><small><span id=ind></span> · ${E(S.me.name)} · <a href=# onclick="logout();return false" style=color:#fff>Keluar</a></small></header><nav>${(own()?TB:TB.slice(0,3)).map(([k,v])=>`<button class="${k==tab?"on":""}" onclick="tab='${k}';render()">${v}</button>`).join("")}</nav><main>${({kasir:vKasir,produk:vProduk,hutang:vHutang,saldo:vSaldo,lap:vLap,akun:vAkun,set:vSet})[tab]()}</main>`;
 ind();if(fq){$("#q")?.focus();fq=0}}
const low=()=>Object.values(M.P).filter(p=>!p.off&&(M.K[p.id]||0)<=p.min);
const lowH=()=>low().length?`<div class="card low">⚠ ${low().length} produk stok menipis</div>`:"";
const tot=()=>cart.reduce((a,i)=>a+i.q*i.price,0);
function resH(){const q=qs.toLowerCase();return(q?Object.values(M.P).filter(p=>!p.off&&(p.name.toLowerCase().includes(q)||p.bc==qs)).slice(0,8):[]).map(p=>`<li class=it onclick="add('${p.id}')"><span>${E(p.name)}<br><span class=m>stok ${M.K[p.id]||0}</span></span><b>${rp(p.price)}</b></li>`).join("")}
function vKasir(){return`${lowH()}<div class=card><div class=row><input id=q placeholder="Ketik nama / scan barcode" value="${E(qs)}" autocomplete=off oninput="qs=this.value;$('#res').innerHTML=resH()" onkeydown="if(event.key=='Enter')addBc(qs)"><button style="flex:none" onclick="scan(addBc)">📷</button></div><ul id=res>${resH()}</ul></div>
<div class=card>${cart.length?cart.map((i,x)=>`<div class=it style=cursor:default><span>${E(i.name)}<br><span class=m>${rp(i.price)}</span></span><span><button onclick="qty(${x},-1)">−</button> ${i.q} <button onclick="qty(${x},1)">+</button></span></div>`).join(""):"<span class=m>Keranjang kosong</span>"}
<div class="row sp"><b>Total</b><b>${rp(tot())}</b></div>
<select id=mt class=w><option value=tunai>Tunai<option value=transfer>Transfer<option value=qris>QRIS<option value=hutang>Hutang</select>
<input id=cu class=w placeholder="Nama pelanggan (wajib untuk hutang)"><input id=pd class=w type=number placeholder="Uang diterima (tunai)" oninput="kb()"><div id=kbx class=m></div>
<button class="btn w" onclick=pay()>Bayar</button></div>`}
const kb=()=>{const v=+$("#pd").value-tot();$("#kbx").textContent=v>=0?"Kembalian "+rp(v):"Kurang "+rp(-v)};
function add(id){const c=cart.find(i=>i.id==id);if(c)c.q++;else cart.push({...M.P[id],q:1});qs="";render()}
function addBc(b){const p=Object.values(M.P).find(p=>!p.off&&p.bc&&p.bc==b);if(p){fq=1;add(p.id)}else if(b&&!resH())alert("Barcode tidak ditemukan: "+b)}
function qty(x,d){cart[x].q+=d;if(cart[x].q<1)cart.splice(x,1);render()}
function pay(){if(!cart.length)return;const m=$("#mt").value,c=$("#cu").value.trim();if(m=="hutang"&&!c)return alert("Isi nama pelanggan untuk hutang");
 const d=new Date(),ymd=d.getFullYear()%100*10000+(d.getMonth()+1)*100+d.getDate();S.n++;
 const s={no:`${S.dev}-${ymd}-${String(S.n).padStart(4,"0")}`,items:cart.map(i=>({pid:i.id,name:i.name,q:i.q,price:i.price,c:i.cost||0})),total:tot(),method:m,cust:c,rec:+$("#pd").value||0,by:S.me.name,ts:Date.now()};
 cart=[];qs="";op("sale",s);receipt(s)}
function receipt(s,c=M.cfg){const l=(a,b)=>`<div style="display:flex;justify-content:space-between"><span>${a}</span><span>${b}</span></div>`,cash=s.method=="tunai"&&s.rec;
 $("#md").innerHTML=`<div class=modal><div><div id=rc>${c.logo?`<img src="${c.logo}" style="display:block;margin:0 auto 4px;max-width:40mm">`:""}<div style=text-align:center><b>${E(c.name)}</b><br>${E(c.header).replace(/\n/g,"<br>")}</div><hr>${E(s.no)}<br>${new Date(s.ts).toLocaleString("id-ID")}<br>Kasir: ${E(s.by)}<hr>${s.items.map(i=>E(i.name)+l(i.q+" x "+rp(i.price),rp(i.q*i.price))).join("")}<hr>${l("<b>TOTAL</b>","<b>"+rp(s.total)+"</b>")}${l(s.method.toUpperCase(),cash?rp(s.rec):"")}${cash?l("Kembali",rp(s.rec-s.total)):""}${s.cust?"<div>Pelanggan: "+E(s.cust)+"</div>":""}<hr><div style=text-align:center>${E(c.footer).replace(/\n/g,"<br>")}</div></div><div class=row><button class=btn onclick="print()">Cetak</button><button onclick="$('#md').innerHTML=''">Tutup</button></div></div></div>`}
async function scan(cb){if(!("BarcodeDetector" in window))return cb(prompt("Browser ini belum bisa scan lewat kamera. Ketik atau scan dengan alat scanner:")||"");
 let s;try{s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}})}catch(e){return alert("Kamera tidak bisa diakses")}
 const m=document.createElement("div");m.className="modal";m.style.zIndex=99;m.innerHTML="<div><video autoplay playsinline muted style=width:100%></video><button class=w>Batal</button></div>";
 const v=m.querySelector("video");v.srcObject=s;document.body.append(m);let on=1;const end=()=>{on=0;s.getTracks().forEach(t=>t.stop());m.remove()};m.querySelector("button").onclick=end;
 const d=new BarcodeDetector();(async function l(){if(!on)return;try{const r=await d.detect(v);if(r[0]){end();return cb(r[0].rawValue)}}catch(e){}setTimeout(l,250)})()}

function vProduk(){return`${lowH()}<div class=card>${own()?`<button class="btn w" onclick="pForm()">+ Produk</button>`:""}<ul>${Object.values(M.P).filter(p=>!p.off).sort((a,b)=>a.name.localeCompare(b.name)).map(p=>{const s=M.K[p.id]||0;return`<li class=it ${own()?`onclick="pForm('${p.id}')"`:""}><span>${E(p.name)}<br><span class=m>${E(p.bc)}${own()?" · modal "+rp(p.cost):""}</span></span><span style=text-align:right><b>${rp(p.price)}</b><br><span class="${s<=p.min?"low":"m"}">stok ${s}</span></span></li>`}).join("")}</ul></div>`}
function pForm(id){const p=M.P[id]||{};$("#md").innerHTML=`<div class=modal><div><h3>${id?"Edit":"Tambah"} produk</h3>
<div class=row><input id=pb placeholder="Barcode / SKU" value="${E(p.bc||"")}"><button style=flex:none onclick="scan(b=>$('#pb').value=b)">📷</button><button style=flex:none onclick="$('#pb').value='LK'+Date.now().toString(36).toUpperCase()">Auto</button></div>
<input class=w id=pn placeholder="Nama produk" value="${E(p.name||"")}"><div class=row><input id=pc type=number placeholder="Harga modal" value="${p.cost||""}"><input id=pp type=number placeholder="Harga jual" value="${p.price||""}"></div>
<div class=row><input id=pm type=number placeholder="Stok minimum" value="${p.min??""}">${id?"":"<input id=ps type=number placeholder='Stok awal'>"}</div>
<div class=row><button class=btn onclick="pSave('${id||""}')">Simpan</button>${id?`<button onclick="addStock('${id}')">+Stok</button><button class=red onclick="pOff('${id}')">Hapus</button>`:""}<button onclick="$('#md').innerHTML=''">Batal</button></div></div></div>`}
function pSave(id){const bc=$("#pb").value.trim(),name=$("#pn").value.trim();if(!name)return alert("Isi nama produk");
 const dup=Object.values(M.P).find(p=>!p.off&&bc&&p.bc==bc&&p.id!=id);if(dup){if(confirm("Barcode sudah dipakai: "+dup.name+". Buka produk itu?"))pForm(dup.id);return}
 const pid=id||S.dev+Date.now().toString(36),cost=+$("#pc").value||0,s=!id&&+$("#ps").value;
 op("prod",{id:pid,bc,name,cost,price:+$("#pp").value||0,min:+$("#pm").value||0,off:false});if(s)op("buy",{pid,qty:s,cost,i:1});$("#md").innerHTML=""}
function addStock(id){const q=+prompt("Jumlah stok masuk:");if(!q)return;const c=+prompt("Harga modal per unit:",M.P[id].cost);op("buy",{pid:id,qty:q,cost:c});$("#md").innerHTML=""}
function pOff(id){if(confirm("Hapus produk ini? Riwayat transaksi tetap aman")){op("prod",{id,off:true});$("#md").innerHTML=""}}

function vHutang(){HL=Object.entries(M.D).filter(([,v])=>v>0);return`<div class=card>${HL.length?"":"<span class=m>Tidak ada hutang</span>"}<ul>${HL.map(([c,v],i)=>`<li class=it onclick="bayarH(${i})"><span>${E(c)}</span><b>${rp(v)}</b></li>`).join("")}</ul></div>`}
function bayarH(i){const[c,v]=HL[i],a=+prompt(`Bayar hutang ${c} (sisa ${rp(v)}). Jumlah:`,v);if(a>0)op("pay",{cust:c,amount:a})}
function vSaldo(){return`<div class=card><div class=m>Saldo</div><h2>${rp(M.saldo)}</h2><div class=m>Modal awal + penjualan + pelunasan hutang − belanja stok</div><button class="btn w" onclick="cashIn()">Tambah modal / setoran</button></div>`}
function cashIn(){const a=+prompt("Jumlah (negatif untuk mengurangi):");if(a)op("cash",{amount:a})}
function vLap(){const n=new Date(),t0=per=="hari"?new Date(n.getFullYear(),n.getMonth(),n.getDate()):per=="minggu"?new Date(n.getFullYear(),n.getMonth(),n.getDate()-6):new Date(n.getFullYear(),n.getMonth(),1);
 const L=M.sales.filter(s=>s.ts>=t0),om=sum(L.map(s=>s.total)),hpp=sum(L.flatMap(s=>s.items.map(i=>i.q*(i.c||0)))),by={},top={};
 for(const s of L){by[s.method]=(by[s.method]||0)+s.total;for(const i of s.items)top[i.name]=(top[i.name]||0)+i.q}
 return`<div class=card><div class=row>${[["hari","Hari ini"],["minggu","7 hari"],["bulan","Bulan ini"]].map(([k,v])=>`<button class="${k==per?"btn":""}" onclick="per='${k}';render()">${v}</button>`).join("")}</div>
<div class="row sp"><span>Omzet</span><b>${rp(om)}</b></div><div class="row sp"><span>Modal barang terjual</span><b>${rp(hpp)}</b></div><div class="row sp"><span>Laba</span><b>${rp(om-hpp)}</b></div><div class="row sp"><span>Transaksi</span><b>${L.length}</b></div></div>
<div class=card><b>Per metode bayar</b>${Object.entries(by).map(([k,v])=>`<div class="row sp"><span>${k}</span><span>${rp(v)}</span></div>`).join("")||"<div class=m>Belum ada</div>"}</div>
<div class=card><b>Produk terlaris</b>${Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([k,v])=>`<div class="row sp"><span>${E(k)}</span><span>${v}</span></div>`).join("")||"<div class=m>Belum ada</div>"}</div>
<div class=card><b>Transaksi terakhir</b><ul>${M.sales.slice(-10).reverse().map((s,k)=>`<li class=it onclick="receipt(M.sales[${M.sales.length-1-k}])"><span>${E(s.no)}</span><b>${rp(s.total)}</b></li>`).join("")}</ul></div>`}

function vAkun(){return`<div class=card><button class="btn w" onclick="uForm()">+ Akun</button><ul>${Object.values(M.U).filter(u=>!u.off).map(u=>`<li class=it onclick="uForm('${u.u}')"><span>${E(u.name)}<br><span class=m>${E(u.u)}</span></span><b>${u.role=="owner"?"Pemilik":"Kasir"}</b></li>`).join("")}</ul></div>`}
function uForm(u){const x=M.U[u]||{};$("#md").innerHTML=`<div class=modal><div><h3>${u?"Edit":"Tambah"} akun</h3>${u?`<div class=m>${E(u)}</div>`:"<input id=uu class=w placeholder=Username autocapitalize=off>"}<input id=un class=w placeholder=Nama value="${E(x.name||"")}"><select id=ur class=w><option value=kasir>Kasir<option value=owner ${x.role=="owner"?"selected":""}>Pemilik</select><input id=up class=w type=password placeholder="${u?"Password baru (kosongkan jika tidak diubah)":"Password"}"><div class=row><button class=btn onclick="uSave('${u||""}')">Simpan</button>${u?`<button class=red onclick="uDel('${u}')">Hapus</button>`:""}<button onclick="$('#md').innerHTML=''">Batal</button></div></div></div>`}
async function uSave(old){const u=old||$("#uu").value.trim().toLowerCase(),name=$("#un").value.trim(),role=$("#ur").value,pw=$("#up").value;
 if(!u||!name||(!old&&!pw))return alert("Lengkapi data");if(!/^[a-z0-9._-]+$/.test(u))return alert("Username: huruf kecil, angka, titik, strip");
 if(!old&&M.U[u])return alert("Username sudah dipakai");if(old==S.me.u&&role!="owner")return alert("Tidak bisa menurunkan peran akun sendiri");
 const d={u,name,role,off:false};if(pw)d.h=await H(u,pw);op("user",d);$("#md").innerHTML=""}
function uDel(u){if(u==S.me.u)return alert("Tidak bisa menghapus akun sendiri");
 if(M.U[u].role=="owner"&&Object.values(M.U).filter(x=>x.role=="owner"&&!x.off).length<2)return alert("Harus ada minimal satu Pemilik");
 if(confirm("Hapus akun "+u+"?")){op("user",{u,off:true});$("#md").innerHTML=""}}

function vSet(){const c=M.cfg;LG=c.logo||"";return`<div class=card><input id=sn class=w placeholder="Nama toko" value="${E(c.name)}"><textarea id=sh class=w rows=3 placeholder="Header (alamat, nomor HP)">${E(c.header)}</textarea><textarea id=sf class=w rows=2 placeholder=Footer>${E(c.footer)}</textarea>
<div class=row><input type=file accept="image/*" onchange="logo(this.files[0])"><img id=lgp ${LG?`src="${LG}"`:""} style=max-width:80px></div>
<div class=row><button class=btn onclick=sSave()>Simpan</button><button onclick=prev()>Pratinjau</button></div><button class=w onclick=openSS()>Buka Spreadsheet</button></div>`}
function logo(f){if(!f)return;const i=new Image();i.onload=()=>{const c=document.createElement("canvas");c.width=200;c.height=i.height*200/i.width;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,200,c.height);x.drawImage(i,0,0,200,c.height);LG=c.toDataURL("image/jpeg",.6);$("#lgp").src=LG};i.src=URL.createObjectURL(f)}
